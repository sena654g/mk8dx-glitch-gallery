            <h1>Confused Lakitu</h1>
             <p>コースを外れた場所でしばらく移動を繰り返した後、落下判定に触れるとジュゲムが混乱しひとつ前のチェックポイントにキャラクターを戻します。</p>
        <p>If you move around outside the course for a while and then touch a fall-detection zone, Lakitu gets confused and returns your character to the previous checkpoint instead of the correct one.</p>
